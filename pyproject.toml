[project]
name = "airblackbox-site"
version = "0.1.0"
description = "AIR Blackbox website and webhook handler"
requires-python = ">=3.12"
# Vercel installs Python functions from THIS file (it generates a uv.lock from
# it) and ignores requirements.txt when a pyproject.toml exists. Keep both in
# step; this one is the one that deploys.
dependencies = ["redis>=5.0.0", "fpdf2>=2.8.0", "air-blackbox>=1.17.0,<2"]
